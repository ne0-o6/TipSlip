<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F 襯線感謝卡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
  html, body { margin: 0; background: transparent; }
  [hidden] { display: none !important; }
  p, h1, ul { margin: 0; }

  #receipt {
    --paper: #f5efe3;
    --ink: #2b2118;
    --ink-soft: #7a6a58;
    --rule: #d8ccb4;
    --accent: #7a2335;
    --serif: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
    --display: "Cormorant Garamond", "Noto Serif TC", "PMingLiU", serif;

    width: 400px;
    box-sizing: border-box;
    padding: 12px;
    background: var(--paper);
    color: var(--ink);
    font: 14px/1.6 var(--serif);
  }

  .frame {
    padding: 34px 28px 30px;
    border: 1px solid var(--accent);
    text-align: center;
    overflow-wrap: anywhere;
  }

  .eyebrow { padding-left: .4em; color: var(--accent); font: 700 13px/1.6 var(--display); letter-spacing: .4em; }
  .shop { margin-top: 10px; font-size: 26px; line-height: 1.2; }
  .title { margin-top: 12px; padding-left: .2em; font-size: 26px; font-weight: 700; line-height: 1.4; letter-spacing: .2em; text-wrap: balance; }

  .ornament {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    color: var(--accent);
  }
  .ornament::before,
  .ornament::after { content: ""; width: 64px; height: 1px; background: currentColor; }

  .label { padding-left: .3em; color: var(--ink-soft); font-size: 12px; letter-spacing: .3em; }

  .parties { margin-top: 22px; }
  .party-name,
  .recipient-list { margin-top: 6px; font-size: 17px; font-weight: 600; text-wrap: balance; }
  .recipient-list { display: flex; flex-direction: column; gap: 4px; padding: 0; list-style: none; }
  .arrow { display: flex; justify-content: center; margin: 10px 0; color: var(--ink-soft); }

  .rule { margin: 24px 0 20px; border: 0; border-top: 1px solid var(--rule); }

  .groups { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .group-to { color: var(--accent); font-size: 13px; font-weight: 600; }
  .items { padding: 0; font-size: 15px; list-style: none; }
  .item-amount,
  .balance-amount { font-family: var(--display); font-variant-numeric: lining-nums; font-weight: 600; white-space: nowrap; }
  .item-amount { font-size: 17px; }
  .empty { margin-top: 4px; color: var(--ink-soft); }

  .total { margin-top: 22px; }
  .total-amount { font: 600 68px/1.05 var(--display); font-variant-numeric: lining-nums; }
  .balance { margin-top: 4px; color: var(--ink-soft); font-size: 13px; }
  .balance-amount { color: var(--ink); font-size: 16px; }

  .status {
    width: fit-content;
    margin: 22px auto 0;
    padding: 5px 16px;
    border-block: 1px solid var(--accent);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .14em;
  }
  .time { display: block; margin-top: 16px; color: var(--ink-soft); font-size: 13px; letter-spacing: .1em; }
</style>
</head>
<body>
<article id="receipt">
  <div class="frame">
    <header>
      <p class="eyebrow">TIP RECEIPT</p>
      <p class="shop" data-if="shop" data-text="shop"></p>
      <h1 class="title">
        <span data-if="note" data-text="note"></span>
        <span data-unless="note">打賞收據</span>
      </h1>
      <div class="ornament" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M5 .5L9.5 5 5 9.5.5 5z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </div>
    </header>

    <section class="parties">
      <div data-if="payer">
        <p class="label">打賞人</p>
        <p class="party-name" data-text="payer"></p>
      </div>
      <div data-if="recipients">
        <div class="arrow" data-if="payer" aria-hidden="true">
          <svg width="14" height="18" viewBox="0 0 14 18" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 1v15M2 11l5 5 5-5"/></svg>
        </div>
        <p class="label">受賞陪陪</p>
        <ul class="recipient-list">
          <template data-each="recipients">
            <li data-text="name"></li>
          </template>
        </ul>
      </div>
    </section>

    <hr class="rule">

    <section class="details">
      <p class="label">打賞明細</p>
      <div class="groups">
        <template data-each="groups">
          <div class="group">
            <p class="group-to" data-if="multi" data-text="to"></p>
            <ul class="items">
              <template data-each="items">
                <li>
                  <span data-text="name"></span>
                  <span data-if="qty" data-text="qty"></span>
                  <span aria-hidden="true">・</span>
                  <span class="item-amount" data-text="amount"></span>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>
      <p class="empty" data-if="noItems">（無明細）</p>
    </section>

    <div class="total" data-if="total">
      <p class="label">總金額</p>
      <p class="total-amount" data-fit="28" data-text="total"></p>
    </div>
    <p class="balance" data-if="balance">扣款後餘額 <span class="balance-amount" data-text="balance"></span></p>

    <footer>
      <p class="status" data-if="status" data-text="status"></p>
      <time class="time" data-text="time.longText" data-attr="datetime:time.iso"></time>
    </footer>
  </div>
</article>
<script src="../_shared/receipt-kit.js"></script>
</body>
</html>
