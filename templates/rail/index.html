<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I 復古硬卡車票</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@600;700&family=Noto+Serif+TC:wght@400;600;700;900&display=swap">
<style>
  html, body { margin: 0; background: transparent; }
  [hidden] { display: none !important; }
  p, h1 { margin: 0; }

  #receipt {
    --card: #d6e5c3;
    --ink: #1b1b1b;
    --ink-soft: #45493f;
    --tag: #a3241c;
    --stamp: #5b3f8f;
    --hole: 12px;
    --serif: "Noto Serif TC", "PMingLiU", "Songti TC", serif;
    --mono: "IBM Plex Mono", Consolas, "Noto Serif TC", monospace;

    display: flex;
    flex-direction: column;
    width: 760px;
    min-height: 380px;
    box-sizing: border-box;
    padding: 24px 92px 24px 34px;
    border-radius: 10px;
    background-color: var(--card);
    background-image:
      repeating-linear-gradient(45deg, rgb(0 0 0 / .04) 0 1px, transparent 1px 7px),
      repeating-linear-gradient(-45deg, rgb(0 0 0 / .04) 0 1px, transparent 1px 7px);
    color: var(--ink);
    font: 14px/1.5 var(--serif);
    mask-image: radial-gradient(circle var(--hole) at calc(100% - 46px) 50%, transparent calc(var(--hole) - .5px), #000 var(--hole));
  }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 10px; border-bottom: 3px double var(--ink); }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .shop { font-size: 24px; line-height: 1; }
  .title { font-size: 22px; font-weight: 900; line-height: 1.4; letter-spacing: .3em; }
  .tag { flex: none; padding: 2px 10px; background: var(--tag); color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .2em; }

  .label { color: var(--ink-soft); font-size: 12px; letter-spacing: .3em; }

  .route { display: flex; align-items: center; gap: 22px; padding: 22px 0 18px; }
  .station { flex: 1 1 0; min-width: 0; }
  .destinations { flex-grow: 1.4; }
  .station-name { margin-top: 2px; font-size: 30px; font-weight: 900; line-height: 1.25; }
  .destinations:not([data-count="1"]) .station-name { font-size: 20px; }
  .destination + .destination { margin-top: 6px; }
  .full-name { margin-top: 2px; color: var(--ink-soft); font-size: 12px; overflow-wrap: anywhere; }
  .arrow { flex: none; }

  .fares { display: flex; border-block: 1px solid var(--ink); }
  .cell { flex: 1 1 0; min-width: 0; padding: 10px 14px; }
  .cell:first-child { flex-grow: 1.6; padding-left: 0; }
  .cell:last-child { padding-right: 0; }
  .cell + .cell { border-left: 1px dashed rgb(0 0 0 / .35); }
  .lines { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .group-to { color: var(--ink-soft); font-size: 12px; font-weight: 700; }
  .line { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
  .price { font-size: 28px; font-weight: 900; line-height: 1.2; }
  .value { margin-top: 2px; font-size: 15px; font-weight: 700; }
  .empty { color: var(--ink-soft); }

  .foot { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: auto; padding-top: 14px; }
  .status { color: var(--ink-soft); font-size: 12px; }
  .note { margin-top: 2px; font-size: 13px; font-weight: 700; letter-spacing: .2em; }
  .date-stamp {
    display: flex;
    flex: none;
    flex-direction: column;
    align-items: center;
    padding: 6px 12px;
    border: 2px solid var(--stamp);
    border-radius: 4px;
    box-shadow: inset 0 0 0 2px var(--card), inset 0 0 0 3px var(--stamp);
    color: var(--stamp);
    font: 700 15px/1.3 var(--mono);
    white-space: pre;
    opacity: .82;
    transform: rotate(-6deg);
  }
  .date-stamp span + span { font-size: 13px; }
</style>
</head>
<body>
<article id="receipt">
  <header class="head">
    <div class="brand">
      <span class="shop" data-if="shop" data-text="shop"></span>
      <h1 class="title">打賞乘車券</h1>
    </div>
    <span class="tag" data-if="payment" data-text="payment"></span>
  </header>

  <section class="route">
    <div class="station">
      <p class="label">起站・打賞人</p>
      <p class="station-name" data-fit="18" data-text="payer"></p>
    </div>
    <svg class="arrow" width="72" height="24" viewBox="0 0 72 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h64M56 4l10 8-10 8"/></svg>
    <div class="station destinations" data-attr="data-count:recipientCount">
      <p class="label">到站・受賞陪陪</p>
      <template data-each="recipients">
        <div class="destination">
          <p class="station-name" data-fit="16" data-text="short"></p>
          <p class="full-name" data-if="showFull" data-text="name"></p>
        </div>
      </template>
    </div>
  </section>

  <section class="fares">
    <div class="cell">
      <p class="label">明細</p>
      <div class="lines">
        <template data-each="groups">
          <div class="group">
            <p class="group-to" data-if="multi" data-text="short"></p>
            <template data-each="items">
              <p class="line"><span data-text="name"></span> <span data-text="qty"></span>・<span data-text="amount"></span></p>
            </template>
          </div>
        </template>
      </div>
      <p class="empty" data-if="noItems">（無明細）</p>
    </div>
    <div class="cell" data-if="total">
      <p class="label">票價</p>
      <p class="price" data-fit="18" data-text="total"></p>
    </div>
    <div class="cell" data-if="balance">
      <p class="label">扣款後餘額</p>
      <p class="value" data-text="balance"></p>
    </div>
  </section>

  <footer class="foot">
    <div>
      <p class="status" data-if="status" data-text="status"></p>
      <p class="note" data-if="note" data-text="note"></p>
    </div>
    <time class="date-stamp" data-attr="datetime:time.iso">
      <span data-text="time.stamp"></span>
      <span data-if="time.time12" data-text="time.time12"></span>
    </time>
  </footer>
</article>
<script src="../_shared/receipt-kit.js"></script>
</body>
</html>
